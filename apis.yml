aid: bagel-labs
name: Bagel Labs
description: 'Bagel Labs is an AI research lab building distributed diffusion training
  infrastructure for frontier diffusion workloads on commodity and heterogeneous GPU
  fleets. Its core method, Distributed Diffusion Models (DDM), replaces a single large
  diffusion model with an ensemble of smaller expert models trained independently on
  dataset partitions with no gradient synchronization, then ensembled at inference by
  a lightweight router (the Paris Inference Engine, PIE). Public releases include Paris-1
  (image diffusion) and Paris 2.0 (video generation), with open weights on Hugging Face
  and papers on arXiv. Founded in 2023 by Bidhan Roy and backed by Polychain Capital,
  the lab targets image, video, world-model, and robotics / physical AI workloads.'
